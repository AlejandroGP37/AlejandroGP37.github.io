<!-- Indica que el documento utiliza HTML5 -->
<!DOCTYPE html>
<!-- Establece el idioma principal del documento -->
<html lang="es">
<!-- Contiene metadatos y recursos del documento -->
<head>
<!-- Define la codificación de caracteres -->
<meta charset="UTF-8">
<!-- Hace que el diseño se adapte al ancho del dispositivo -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Asocia el icono de la página -->
<link rel="icon" type="image/png" href="favicon.png">
<!-- Asocia la hoja de estilos común -->
<link rel="stylesheet" href="../css/styles.css">
<!-- Define el título que aparece en la pestaña -->
<title>Amigos de la informática</title>
<!-- Cierra la sección de metadatos -->
</head>
<!-- Aplica la clase visual del cuestionario -->
<body class="form-page club-page">
<!-- Contiene el encabezado del cuestionario -->
<header class="form-header">
<!-- Muestra el título exacto del club -->
<h1>Cuestionario para formar parte del club "Amigos de la informática"</h1>
<!-- Cierra el encabezado -->
</header>
<!-- Contiene el bloque central del cuestionario -->
<main class="form-card">
<!-- Agrupa todos los controles del cuestionario -->
<form>
<!-- Agrupa los datos personales del socio -->
<fieldset class="personal-data">
<!-- Muestra el legend de datos personales -->
<legend>Datos personales</legend>
<!-- Agrupa el nombre -->
<p>
<!-- Describe el campo nombre -->
<label for="nombre">Nombre:</label>
<!-- Recibe el nombre -->
<input type="text" id="nombre" name="nombre">
<!-- Cierra el párrafo nombre -->
</p>
<!-- Agrupa el domicilio -->
<p>
<!-- Describe el domicilio -->
<label for="domicilio">Domicilio:</label>
<!-- Recibe calle, número y localidad -->
<input type="text" id="domicilio" name="domicilio" placeholder="calle, número y localidad">
<!-- Cierra el párrafo domicilio -->
</p>
<!-- Agrupa el país de origen -->
<p>
<!-- Describe el país de origen -->
<label for="pais">País de origen:</label>
<!-- Permite elegir el país -->
<select id="pais" name="pais">
<!-- Muestra España como opción inicial -->
<option value="espana" selected>España</option>
<!-- Muestra Portugal como opción -->
<option value="portugal">Portugal</option>
<!-- Muestra Francia como opción -->
<option value="francia">Francia</option>
<!-- Muestra otro como opción -->
<option value="otro">Otro</option>
<!-- Cierra la lista de países -->
</select>
<!-- Cierra el párrafo país -->
</p>
<!-- Agrupa la fecha de nacimiento -->
<p>
<!-- Describe la fecha de nacimiento -->
<label for="fecha-nacimiento">Fecha de nacimiento:</label>
<!-- Permite introducir la fecha -->
<input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
<!-- Cierra el párrafo fecha -->
</p>
<!-- Agrupa el correo electrónico -->
<p>
<!-- Describe el correo electrónico -->
<label for="correo">Correo electrónico:</label>
<!-- Recibe el correo electrónico -->
<input type="email" id="correo" name="correo">
<!-- Cierra el párrafo correo -->
</p>
<!-- Agrupa el teléfono -->
<p>
<!-- Describe el teléfono -->
<label for="telefono">Teléfono:</label>
<!-- Recibe el número de teléfono -->
<input type="tel" id="telefono" name="telefono">
<!-- Cierra el párrafo teléfono -->
</p>
<!-- Agrupa el estado civil -->
<fieldset class="civil-status">
<!-- Muestra el legend estado civil -->
<legend>Estado civil</legend>
<!-- Permite seleccionar soltero -->
<input type="radio" id="soltero" name="estado-civil" value="soltero">
<!-- Describe soltero -->
<label for="soltero">Soltero/a</label>
<!-- Permite seleccionar casado -->
<input type="radio" id="casado" name="estado-civil" value="casado">
<!-- Describe casado -->
<label for="casado">Casado/a</label>
<!-- Permite seleccionar separado -->
<input type="radio" id="separado" name="estado-civil" value="separado">
<!-- Describe separado -->
<label for="separado">Separado/a</label>
<!-- Permite seleccionar viudo -->
<input type="radio" id="viudo" name="estado-civil" value="viudo">
<!-- Describe viudo -->
<label for="viudo">Viudo/a</label>
<!-- Cierra estado civil -->
</fieldset>
<!-- Agrupa el sexo -->
<fieldset class="sex-data">
<!-- Muestra el legend sexo -->
<legend>Sexo</legend>
<!-- Permite seleccionar hombre -->
<input type="radio" id="hombre" name="sexo" value="hombre">
<!-- Describe hombre -->
<label for="hombre">Hombre</label>
<!-- Permite seleccionar mujer -->
<input type="radio" id="mujer" name="sexo" value="mujer">
<!-- Describe mujer -->
<label for="mujer">Mujer</label>
<!-- Cierra sexo -->
</fieldset>
<!-- Cierra datos personales -->
</fieldset>
<!-- Agrupa la otra información -->
<fieldset class="interest-data">
<!-- Muestra el legend de información adicional -->
<legend>Otra información de interés</legend>
<!-- Agrupa los componentes electrónicos -->
<p class="devices-row">
<!-- Describe la selección múltiple -->
<label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabaja:</label>
<!-- Permite seleccionar varios componentes -->
<select id="componentes" name="componentes" multiple size="4">
<!-- Muestra la opción móvil -->
<option value="movil">Móvil</option>
<!-- Muestra la opción tablet -->
<option value="tablet">Tablet</option>
<!-- Muestra la opción ordenador -->
<option value="ordenador">Ordenador</option>
<!-- Muestra la opción ebook -->
<option value="ebook">Ebook</option>
<!-- Cierra la selección múltiple -->
</select>
<!-- Cierra el párrafo componentes -->
</p>
<!-- Agrupa las actividades favoritas -->
<fieldset class="activities-data">
<!-- Muestra el legend actividades -->
<legend>Seleccione sus actividades favoritas</legend>
<!-- Permite marcar deporte -->
<input type="checkbox" id="deporte" name="actividades" value="deporte">
<!-- Describe deporte -->
<label for="deporte">Hacer deporte</label>
<!-- Permite marcar amigos -->
<input type="checkbox" id="amigos" name="actividades" value="amigos">
<!-- Describe amigos -->
<label for="amigos">Salir con mis amigos</label>
<!-- Permite marcar series -->
<input type="checkbox" id="series" name="actividades" value="series">
<!-- Describe series -->
<label for="series">Ver series, películas...</label>
<!-- Permite marcar senderismo -->
<input type="checkbox" id="senderismo" name="actividades" value="senderismo">
<!-- Describe senderismo -->
<label for="senderismo">Realizar rutas de senderismo</label>
<!-- Permite marcar cine -->
<input type="checkbox" id="cine" name="actividades" value="cine">
<!-- Describe cine -->
<label for="cine">Ir al cine</label>
<!-- Permite marcar música -->
<input type="checkbox" id="musica" name="actividades" value="musica">
<!-- Describe música -->
<label for="musica">Escuchar música</label>
<!-- Cierra actividades favoritas -->
</fieldset>
<!-- Agrupa el motivo de ingreso -->
<p>
<!-- Describe el campo motivo -->
<label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label>
<!-- Permite escribir el motivo -->
<textarea id="motivo" name="motivo" rows="4"></textarea>
<!-- Cierra el párrafo motivo -->
</p>
<!-- Agrupa la película favorita -->
<p>
<!-- Describe el campo película -->
<label for="pelicula">Elija o escriba su película favorita:</label>
<!-- Recibe la película favorita -->
<input type="text" id="pelicula" name="pelicula">
<!-- Cierra el párrafo película -->
</p>
<!-- Cierra otra información -->
</fieldset>
<!-- Contiene los botones de acción -->
<p class="form-actions">
<!-- Envía el cuestionario -->
<button type="submit">Enviar</button>
<!-- Limpia los datos del cuestionario -->
<button type="reset">Limpiar datos</button>
<!-- Cierra el bloque de acciones -->
</p>
<!-- Cierra el formulario -->
</form>
<!-- Cierra el contenido principal -->
</main>
<!-- Contiene enlaces de navegación -->
<footer>
<!-- Permite volver a la página principal -->
<a href="../index.html">Volver al inicio</a>
<!-- Permite ir al otro formulario -->
<a href="hoja-inscripcion.html">Hoja de inscripción</a>
<!-- Cierra el pie -->
</footer>
<!-- Cierra el cuerpo del documento -->
</body>
<!-- Cierra el documento HTML -->
</html>
