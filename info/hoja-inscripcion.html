<!-- Indica que el documento utiliza HTML5 -->
<!DOCTYPE html>
<!-- Establece el idioma principal del documento -->
<html lang="es">
<!-- Contiene metadatos y recursos del documento -->
<head>
<!-- Define la codificación de caracteres -->
<meta charset="UTF-8">
<!-- Hace que el diseño se adapte al ancho del dispositivo -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Asocia el icono de la página -->
<link rel="icon" type="image/png" href="favicon.png">
<!-- Asocia la hoja de estilos común -->
<link rel="stylesheet" href="../css/styles.css">
<!-- Define el título que aparece en la pestaña -->
<title>Hoja de inscripción</title>
<!-- Cierra la sección de metadatos -->
</head>
<!-- Aplica la clase visual de la hoja de inscripción -->
<body class="form-page inscription-page">
<!-- Contiene el encabezado principal del formulario -->
<header class="form-header">
<!-- Muestra el título principal de la maqueta -->
<h1>Hoja de inscripción</h1>
<!-- Muestra el subtítulo exacto de la actividad -->
<p>En los ciclos formativos de grado superior</p>
<!-- Cierra el encabezado -->
</header>
<!-- Contiene el bloque central del formulario -->
<main class="form-card">
<!-- Agrupa todos los controles del formulario -->
<form>
<!-- Agrupa los datos personales del alumno -->
<fieldset class="personal-data">
<!-- Muestra el legend gris de datos personales -->
<legend>Datos personales</legend>
<!-- Agrupa la primera fila en tres columnas -->
<div class="personal-row">
<!-- Agrupa el nombre -->
<p>
<!-- Describe el campo nombre -->
<label for="nombre">Nombre:</label>
<!-- Recibe el nombre del alumno -->
<input type="text" id="nombre" name="nombre">
<!-- Cierra el nombre -->
</p>
<!-- Agrupa los apellidos -->
<p>
<!-- Describe el campo apellidos -->
<label for="apellidos">Apellidos:</label>
<!-- Recibe los apellidos del alumno -->
<input type="text" id="apellidos" name="apellidos">
<!-- Cierra los apellidos -->
</p>
<!-- Agrupa el DNI -->
<p>
<!-- Describe el campo DNI -->
<label for="dni">DNI:</label>
<!-- Recibe el DNI del alumno -->
<input type="text" id="dni" name="dni">
<!-- Cierra el DNI -->
</p>
<!-- Cierra la primera fila -->
</div>
<!-- Agrupa la segunda fila en tres columnas -->
<div class="personal-row">
<!-- Agrupa la localidad -->
<p>
<!-- Describe la localidad de nacimiento -->
<label for="localidad">Localidad de nacimiento:</label>
<!-- Recibe la localidad de nacimiento -->
<input type="text" id="localidad" name="localidad">
<!-- Cierra la localidad -->
</p>
<!-- Agrupa la provincia -->
<p>
<!-- Describe el campo provincia -->
<label for="provincia">Provincia:</label>
<!-- Prepara el campo con Huelva como valor inicial -->
<input type="text" id="provincia" name="provincia" value="Huelva">
<!-- Cierra la provincia -->
</p>
<!-- Agrupa la fecha -->
<p>
<!-- Describe la fecha de nacimiento -->
<label for="fecha-nacimiento">Fecha de nacimiento:</label>
<!-- Permite seleccionar la fecha de nacimiento -->
<input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
<!-- Cierra la fecha -->
</p>
<!-- Cierra la segunda fila -->
</div>
<!-- Agrupa la tercera fila -->
<div class="personal-row postal-row">
<!-- Agrupa la dirección -->
<p>
<!-- Describe el campo dirección -->
<label for="direccion">Dirección:</label>
<!-- Recibe la dirección del alumno -->
<input type="text" id="direccion" name="direccion">
<!-- Cierra la dirección -->
</p>
<!-- Agrupa el código postal -->
<p>
<!-- Describe el código postal -->
<label for="codigo-postal">Código postal:</label>
<!-- Recibe el código postal -->
<input type="text" id="codigo-postal" name="codigo-postal">
<!-- Cierra el código postal -->
</p>
<!-- Cierra la tercera fila -->
</div>
<!-- Cierra el grupo de datos personales -->
</fieldset>
<!-- Agrupa la forma de acceso -->
<fieldset class="access-data">
<!-- Muestra el legend melocotón -->
<legend>Forma de acceso</legend>
<!-- Separa el acceso directo -->
<p>
<!-- Permite seleccionar acceso directo -->
<input type="radio" id="acceso-directo" name="forma-acceso" value="directo">
<!-- Describe el acceso directo -->
<label for="acceso-directo">Directo</label>
<!-- Cierra el párrafo directo -->
</p>
<!-- Presenta las opciones derivadas en lista -->
<ul>
<!-- Presenta la opción Bachillerato -->
<li>
<!-- Permite seleccionar Bachillerato -->
<input type="radio" id="bachillerato" name="forma-acceso" value="bachillerato">
<!-- Describe la opción Bachillerato -->
<label for="bachillerato">Bachillerato Log. Modalidad</label>
<!-- Recibe la modalidad de Bachillerato -->
<input type="text" id="modalidad" name="modalidad" aria-label="Modalidad de bachillerato">
<!-- Cierra la opción Bachillerato -->
</li>
<!-- Presenta la opción Experimental -->
<li>
<!-- Permite seleccionar Experimental -->
<input type="radio" id="experimental" name="forma-acceso" value="experimental">
<!-- Describe la opción Experimental -->
<label for="experimental">Experimental</label>
<!-- Cierra la opción Experimental -->
</li>
<!-- Presenta la opción COU -->
<li>
<!-- Permite seleccionar COU -->
<input type="radio" id="cou" name="forma-acceso" value="cou">
<!-- Describe la opción COU -->
<label for="cou">COU Opción</label>
<!-- Recibe la opción concreta de COU -->
<input type="text" id="opcion-cou" name="opcion-cou" aria-label="Opción de COU">
<!-- Cierra la opción COU -->
</li>
<!-- Presenta la opción FP2 -->
<li>
<!-- Permite seleccionar FP2 -->
<input type="radio" id="fp2" name="forma-acceso" value="fp2">
<!-- Describe la opción FP2 -->
<label for="fp2">FP2</label>
<!-- Cierra la opción FP2 -->
</li>
<!-- Presenta la opción Otros -->
<li>
<!-- Permite seleccionar Otros -->
<input type="radio" id="otros" name="forma-acceso" value="otros">
<!-- Describe la opción Otros -->
<label for="otros">Otros (especifique)</label>
<!-- Recibe el detalle de otra forma de acceso -->
<input type="text" id="otros-acceso" name="otros-acceso" aria-label="Especifica otra forma de acceso">
<!-- Cierra la opción Otros -->
</li>
<!-- Cierra la lista de opciones -->
</ul>
<!-- Separa la prueba libre -->
<p>
<!-- Permite seleccionar Prueba libre -->
<input type="radio" id="prueba-libre" name="forma-acceso" value="prueba-libre">
<!-- Describe la opción Prueba libre -->
<label for="prueba-libre">Prueba libre</label>
<!-- Cierra el párrafo de prueba libre -->
</p>
<!-- Cierra el grupo de forma de acceso -->
</fieldset>
<!-- Agrupa los documentos adjuntados -->
<fieldset class="documents-data">
<!-- Muestra el legend rosa -->
<legend>Documentos adjuntados</legend>
<!-- Agrupa los documentos principales -->
<p>
<!-- Permite adjuntar fotocopia del DNI -->
<input type="checkbox" id="fotocopia-dni" name="documentos" value="fotocopia-dni">
<!-- Describe la fotocopia del DNI -->
<label for="fotocopia-dni">Fotocopia DNI</label>
<!-- Permite adjuntar el certificado académico -->
<input type="checkbox" id="certificado" name="documentos" value="certificado-academico">
<!-- Describe el certificado académico -->
<label for="certificado">Certificado académico</label>
<!-- Cierra el párrafo de documentos principales -->
</p>
<!-- Agrupa la opción de otros documentos -->
<p>
<!-- Permite marcar otros documentos -->
<input type="checkbox" id="otros-documentos" name="documentos" value="otros">
<!-- Describe la opción Otros documentos -->
<label for="otros-documentos">Otros documentos (especifique)</label>
<!-- Recibe el detalle de los otros documentos -->
<input type="text" id="detalle-documentos" name="detalle-documentos" aria-label="Especifica otros documentos">
<!-- Cierra el párrafo de otros documentos -->
</p>
<!-- Cierra el grupo de documentos -->
</fieldset>
<!-- Contiene los botones de acción -->
<p class="form-actions">
<!-- Envía los datos del formulario -->
<button type="submit">Enviar Solicitud</button>
<!-- Borra los datos introducidos -->
<button type="reset">Limpiar datos</button>
<!-- Cierra el bloque de acciones -->
</p>
<!-- Cierra el formulario -->
</form>
<!-- Cierra el contenido principal -->
</main>
<!-- Contiene enlaces de navegación -->
<footer>
<!-- Permite volver a la página principal -->
<a href="../index.html">Volver al inicio</a>
<!-- Permite ir al otro formulario -->
<a href="amigos-informatica.html">Amigos de la informática</a>
<!-- Cierra el pie -->
</footer>
<!-- Cierra el cuerpo del documento -->
</body>
<!-- Cierra el documento HTML -->
</html>
