<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Contacto | Restaurante El Planton</title>
</head>
<body>
    <header>
        <h1>Envíanos un mensaje</h1>
    </header>

    <nav>
        <a href="formularios-restaurante.html">Volver a formularios</a>
    </nav>

    <main>
        <form>
            <fieldset>
                <legend>Datos de contacto</legend>
                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </p>
                <p>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" required>
                </p>
                <p>
                    <label for="telefono">Teléfono (opcional):</label>
                    <input type="tel" id="telefono" name="telefono" autocomplete="tel">
                </p>
                <p>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                </p>
                <p>
                    <label for="mensaje">Tu mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="7" cols="45" required></textarea>
                </p>
            </fieldset>
            <p>
                <button type="submit">Enviar mensaje</button>
                <button type="reset">Borrar datos</button>
            </p>
        </form>
    </main>

    <footer>
        <a href="iniciorestaurante.html">Volver al restaurante</a>
    </footer>
</body>
</html>
